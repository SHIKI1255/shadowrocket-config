{
  "schema_version": 2,
  "repositories": {
    "v2fly": {
      "repo": "v2fly/domain-list-community",
      "ref": "master",
      "archive": "tarball",
      "license": "MIT",
      "license_path": "LICENSE"
    },
    "metacubex": {
      "repo": "MetaCubeX/meta-rules-dat",
      "ref": "meta",
      "license": "GPL-3.0",
      "license_ref": "master",
      "license_path": "LICENSE"
    }
  },
  "limits": {
    "min_ratio": 0.75,
    "max_ratio": 1.6,
    "max_removed_ratio": 0.25,
    "max_added_ratio": 0.6,
    "small_source_threshold": 100,
    "small_source_delta": 40,
    "min_absolute_rules": 1
  },
  "sources": [
    {
      "id": "openai",
      "repository": "v2fly",
      "path": "data/openai",
      "format": "v2fly",
      "policy": "PROXY",
      "min_rules": 5,
      "max_rules": 500,
      "regex_overrides": {
        "^chatgpt-async-webps-prod-\\S+-\\d+\\.webpubsub\\.azure\\.com$": "DOMAIN-WILDCARD,chatgpt-async-webps-prod-*.webpubsub.azure.com"
      }
    },
    {
      "id": "claude",
      "repository": "v2fly",
      "path": "data/anthropic",
      "format": "v2fly",
      "policy": "PROXY",
      "min_rules": 5,
      "max_rules": 500
    },
    {
      "id": "gemini",
      "repository": "v2fly",
      "path": "data/google-deepmind",
      "format": "v2fly",
      "policy": "PROXY",
      "min_rules": 10,
      "max_rules": 500
    },
    {
      "id": "xai",
      "repository": "v2fly",
      "path": "data/xai",
      "format": "v2fly",
      "policy": "PROXY",
      "min_rules": 2,
      "max_rules": 200
    },
    {
      "id": "voice",
      "url": "https://openai.com/chatgpt-voice.json",
      "format": "voice",
      "policy": "PROXY",
      "dynamic_ip": true,
      "min_rules": 50,
      "max_rules": 2000
    },
    {
      "id": "github",
      "repository": "v2fly",
      "path": "data/github",
      "format": "v2fly",
      "policy": "PROXY",
      "min_rules": 20,
      "max_rules": 500
    },
    {
      "id": "telegram",
      "repository": "v2fly",
      "path": "data/telegram",
      "format": "v2fly",
      "policy": "PROXY",
      "min_rules": 10,
      "max_rules": 300
    },
    {
      "id": "telegram_ip",
      "url": "https://core.telegram.org/resources/cidr.txt",
      "format": "cidr_list",
      "policy": "PROXY",
      "dynamic_ip": true,
      "min_ipv4_prefix": 19,
      "min_ipv6_prefix": 32,
      "min_rules": 5,
      "max_rules": 100
    },
    {
      "id": "google",
      "repository": "v2fly",
      "path": "data/google",
      "format": "v2fly",
      "policy": "PROXY",
      "exclude_attrs": [
        "@cn"
      ],
      "skip_regex": true,
      "min_rules": 300,
      "max_rules": 5000
    },
    {
      "id": "twitter",
      "repository": "v2fly",
      "path": "data/twitter",
      "format": "v2fly",
      "policy": "PROXY",
      "min_rules": 10,
      "max_rules": 300
    },
    {
      "id": "tiktok",
      "repository": "v2fly",
      "path": "data/tiktok",
      "format": "v2fly",
      "policy": "PROXY",
      "exclude_domains": [
        "bytedapm.com"
      ],
      "min_rules": 15,
      "max_rules": 300
    },
    {
      "id": "crypto",
      "repository": "v2fly",
      "path": "data/category-cryptocurrency",
      "format": "v2fly",
      "policy": "PROXY",
      "min_rules": 80,
      "max_rules": 2000
    },
    {
      "id": "steam_cn",
      "repository": "v2fly",
      "path": "data/steam",
      "format": "v2fly",
      "policy": "DIRECT",
      "require_attrs": [
        "@cn"
      ],
      "extra_domains": [
        "steamcontent.com",
        "steamserver.net",
        "steamusercontent.com"
      ],
      "min_rules": 10,
      "max_rules": 200
    },
    {
      "id": "steam",
      "repository": "v2fly",
      "path": "data/steam",
      "format": "v2fly",
      "policy": "PROXY",
      "exclude_attrs": [
        "@cn"
      ],
      "exclude_domains": [
        "steamcontent.com",
        "steamserver.net",
        "steamusercontent.com"
      ],
      "min_rules": 15,
      "max_rules": 300
    },
    {
      "id": "apple",
      "repository": "v2fly",
      "path": "data/apple",
      "format": "v2fly",
      "policy": "DIRECT",
      "min_rules": 500,
      "max_rules": 5000
    },
    {
      "id": "microsoft",
      "repository": "v2fly",
      "path": "data/microsoft",
      "format": "v2fly",
      "policy": "DIRECT",
      "min_rules": 200,
      "max_rules": 3000
    },
    {
      "id": "bilibili",
      "repository": "v2fly",
      "path": "data/bilibili",
      "format": "v2fly",
      "policy": "DIRECT",
      "exclude_attrs": [
        "@!cn"
      ],
      "min_rules": 20,
      "max_rules": 500
    },
    {
      "id": "proxy",
      "repository": "metacubex",
      "path": "geo/geosite/gfw.list",
      "format": "domain_set",
      "policy": "PROXY",
      "min_rules": 1500,
      "max_rules": 15000
    },
    {
      "id": "proxy_v2fly",
      "repository": "v2fly",
      "paths": [
        "data/category-social-media-!cn",
        "data/category-communication",
        "data/category-dev",
        "data/youtube",
        "data/netflix",
        "data/discord",
        "data/reddit",
        "data/twitch",
        "data/spotify",
        "data/amazon",
        "data/wikimedia"
      ],
      "format": "v2fly",
      "policy": "PROXY",
      "exclude_attrs": [
        "@cn"
      ],
      "skip_regex": true,
      "min_rules": 1000,
      "max_rules": 15000
    },
    {
      "id": "china",
      "repository": "v2fly",
      "path": "data/cn",
      "format": "v2fly",
      "policy": "DIRECT",
      "exclude_attrs": [
        "@!cn"
      ],
      "skip_regex": true,
      "min_rules": 4000,
      "max_rules": 25000
    }
  ]
}
