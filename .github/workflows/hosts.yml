name: Validate Hosts module

on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'local_task_preflight_profile.yaml'
      - 'tests/test_keepalive.py'
      - 'modules/**'
      - 'scripts/hosts_core.py'
      - 'scripts/sync_hosts.py'
      - 'scripts/validate_hosts.py'
      - 'tests/test_hosts*.py'
      - 'requirements-hosts.txt'
      - '.github/workflows/hosts.yml'
      - '.github/workflows/update.yml'
  pull_request:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'local_task_preflight_profile.yaml'
      - 'tests/test_keepalive.py'
      - 'modules/**'
      - 'scripts/hosts_core.py'
      - 'scripts/sync_hosts.py'
      - 'scripts/validate_hosts.py'
      - 'tests/test_hosts*.py'
      - 'requirements-hosts.txt'
      - '.github/workflows/hosts.yml'
      - '.github/workflows/update.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosts-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  hosts:
    name: Hosts module and sync tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate public module without site packages
        run: python -B -S scripts/validate_hosts.py
      - name: Install pinned parser for synthetic tests only
        run: python -m pip install --disable-pip-version-check -r requirements-hosts.txt
      - name: Verify parser and run failure-path tests without any subscription secrets
        run: |
          python -B -c "import yaml; assert yaml.__version__ == '6.0.3'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tests -v
