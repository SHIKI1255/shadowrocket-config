name: Validate and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      replay_commit:
        description: 'Optional full release commit SHA to rebuild archived inputs (rollback/reproduction)'
        required: false
        type: string
  schedule:
    # UTC 22:17 = Asia/Shanghai 06:17 the following day. GitHub may delay scheduled jobs.
    - cron: '17 22 * * *'

permissions:
  contents: read

concurrency:
  group: shadowrocket-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      REPLAY_COMMIT: ${{ inputs.replay_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Unit and failure-path tests
        run: python -B -m unittest discover -s tests -v
      - name: Download, convert, validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $argsList = @('-B', 'scripts/build.py', '--output', "$env:RUNNER_TEMP/release", '--previous-release')
          if ($env:REPLAY_COMMIT) { $argsList += @('--replay-commit', $env:REPLAY_COMMIT) }
          & python @argsList
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline reproducibility check
        run: |
          python -B scripts/build.py --replay "$env:RUNNER_TEMP/release" --output "$env:RUNNER_TEMP/replay"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $original = Get-Content -LiteralPath "$env:RUNNER_TEMP/release/SHA256SUMS" -Raw
          $replayed = Get-Content -LiteralPath "$env:RUNNER_TEMP/replay/SHA256SUMS" -Raw
          if ($original -cne $replayed) { throw 'Non-deterministic build' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release
          path: ${{ runner.temp }}/release
      - name: Publish validated tree atomically
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B scripts/publish.py "$env:RUNNER_TEMP/release"
