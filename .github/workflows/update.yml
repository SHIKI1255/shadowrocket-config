name: Validate and publish

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/maintenance.json'
      - 'AGENTS.md'
      - 'local_task_preflight_profile.yaml'
      - 'tests/test_keepalive.py'
      - 'modules/**'
      - 'scripts/hosts_core.py'
      - 'scripts/sync_hosts.py'
      - 'scripts/validate_hosts.py'
      - 'requirements-hosts.txt'
      - '.github/workflows/hosts.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'AGENTS.md'
      - 'local_task_preflight_profile.yaml'
      - 'tests/test_keepalive.py'
      - 'modules/**'
      - 'scripts/hosts_core.py'
      - 'scripts/sync_hosts.py'
      - 'scripts/validate_hosts.py'
      - 'requirements-hosts.txt'
      - '.github/workflows/hosts.yml'
  workflow_dispatch:
    inputs:
      replay_commit:
        description: 'Optional full release commit SHA to rebuild archived inputs (rollback/reproduction)'
        required: false
        type: string
  schedule:
    # UTC 22:00 and 10:00 = Asia/Shanghai 06:00 and 18:00, one hour before the
    # 07:00/19:00 consumer checks. GitHub may delay scheduled jobs.
    - cron: '0 10,22 * * *'

permissions:
  contents: read

concurrency:
  group: shadowrocket-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      REPLAY_COMMIT: ${{ inputs.replay_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Unit and failure-path tests
        run: python -B -m unittest discover -s tests -v
      - name: Download, convert, validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(-B scripts/build.py --output "$RUNNER_TEMP/release" --previous-release --diagnostics "$RUNNER_TEMP/evidence")
          if [ -n "${REPLAY_COMMIT:-}" ]; then args+=(--replay-commit "$REPLAY_COMMIT"); fi
          python "${args[@]}"
      - name: Preserve public evidence independently of publishable artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-evidence
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Offline reproducibility check
        run: |
          python -B scripts/build.py --replay "$RUNNER_TEMP/release" --output "$RUNNER_TEMP/replay"
          cmp -s "$RUNNER_TEMP/release/SHA256SUMS" "$RUNNER_TEMP/replay/SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release
          path: ${{ runner.temp }}/release
      - name: Publish validated tree atomically
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B scripts/publish.py "$RUNNER_TEMP/release"
      - name: Verify anonymous fixed and rolling download hashes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B scripts/release_health.py --verify "$RUNNER_TEMP/release"

  monitor:
    if: always() && github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Read optional public evidence
        continue-on-error: true # Early unit/infrastructure failure may not produce evidence.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: public-evidence
          path: ${{ runner.temp }}/evidence
      - name: Deduplicate incident and prepare review-only candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_RESULTS: '{"validate":"${{ needs.validate.result }}","publish":"${{ needs.publish.result }}"}'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B scripts/release_health.py --evidence "$RUNNER_TEMP/evidence"

  maintenance:
    # Runs after publication (also after failure); never advances main mid-publish.
    if: always() && github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
    needs: [validate, publish, monitor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Record maintenance when 30 days have elapsed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B scripts/keepalive.py
